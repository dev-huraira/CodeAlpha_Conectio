<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to Conectio — Connect with purpose.">
    <title>Sign In — Conectio</title>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230A66C2'/><text x='16' y='23' font-family='Arial' font-size='20' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">

    <style>
        .auth-page {
            min-height: calc(100vh - var(--navbar-height) - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg) var(--space-base);
        }
        .auth-card {
            max-width: 400px;
            width: 100%;
            animation: fadeSlideUp 500ms ease-out;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: var(--space-lg);
        }
        .auth-logo__text {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -0.5px;
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--color-text-secondary);
            padding: 4px;
            line-height: 1;
            transition: color var(--transition-fast);
        }
        .password-toggle:hover {
            color: var(--color-text-primary);
        }
        .forgot-link {
            display: inline-block;
            margin-top: var(--space-xs);
            font-size: var(--font-size-sm);
            color: var(--color-primary);
            font-weight: 600;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-loading .spinner--sm {
            display: inline-block;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ═══════════════ NAVBAR ═══════════════ -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="navbar__inner">
            <a href="index.html" class="navbar__logo" id="navbar-logo">
                <div class="navbar__logo-icon">C</div>
                Conectio
            </a>
            <div class="navbar__links" id="navbar-links">
                <a href="register.html" class="btn-secondary btn-secondary--sm" id="nav-join">Join now</a>
            </div>
        </div>
    </nav>
    <div class="navbar-spacer"></div>


    <!-- ═══════════════ LOGIN FORM ═══════════════ -->
    <main class="auth-page">
        <div class="auth-card card-shadow" id="login-card">
            <div class="auth-logo">
                <span class="auth-logo__text">Conectio</span>
            </div>

            <h1 class="auth-card__title" id="login-title">Sign in</h1>
            <p class="auth-card__subtitle">Stay updated on your professional world.</p>

            <div id="login-error" class="alert alert--error" style="display: none;"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email" class="form-label">Email</label>
                    <input
                        type="email"
                        id="login-email"
                        class="input-field"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                    <div class="form-error" id="login-email-error" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="login-password"
                            class="input-field"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" id="login-password-toggle" aria-label="Show password">
                            👁️
                        </button>
                    </div>
                    <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" id="login-submit" style="width: 100%; margin-top: 16px;">
                    Sign in
                </button>
            </form>

            <div class="divider-text" style="margin: var(--space-lg) 0;">or</div>

            <div class="auth-card__footer" style="margin-top: 0;">
                New to Conectio? <a href="register.html" id="login-register-link">Join now</a>
            </div>
        </div>
    </main>


    <!-- ═══════════════ FOOTER ═══════════════ -->
    <footer class="footer" id="footer">
        <span class="footer__brand">Conectio</span> &copy; 2025 · Connect with purpose.
    </footer>


    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        // Redirect if already logged in
        if (window.auth && window.auth.isLoggedIn()) {
            window.location.href = 'index.html';
        }

        // Password show/hide toggle
        document.getElementById('login-password-toggle').addEventListener('click', () => {
            const input = document.getElementById('login-password');
            const toggle = document.getElementById('login-password-toggle');
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = '🙈';
                toggle.setAttribute('aria-label', 'Hide password');
            } else {
                input.type = 'password';
                toggle.textContent = '👁️';
                toggle.setAttribute('aria-label', 'Show password');
            }
        });

        // Forgot password placeholder
        document.getElementById('forgot-password-link').addEventListener('click', (e) => {
            e.preventDefault();
            window.app.showToast('Password reset coming soon!', 'info');
        });

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorEl = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-submit');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            // Reset errors
            errorEl.style.display = 'none';
            document.getElementById('login-email-error').style.display = 'none';
            document.getElementById('login-email').classList.remove('input-field--error');

            // Client-side validation
            if (!email || !password) {
                errorEl.textContent = 'Please enter both email and password.';
                errorEl.style.display = 'flex';
                return;
            }

            if (!email.includes('@')) {
                const emailError = document.getElementById('login-email-error');
                emailError.textContent = 'Please enter a valid email address.';
                emailError.style.display = 'block';
                document.getElementById('login-email').classList.add('input-field--error');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner spinner--sm" style="border-top-color: #fff; border-color: rgba(255,255,255,0.3); border-top-color: #fff; width: 18px; height: 18px;"></div> Signing in...';

            try {
                const data = await window.api.post('/users/login/', { email, password });

                // Save tokens + user data
                window.auth.saveToken(data.tokens.access, data.tokens.refresh);
                window.auth.saveUser(data.user);

                window.location.href = 'index.html';
            } catch (err) {
                const message = err.data?.detail || err.message || 'Something went wrong. Please try again.';
                errorEl.textContent = message;
                errorEl.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign in';
            }
        });
    </script>
</body>
</html>
